# 司法規費資料（curated）——依全國法規資料庫之條文原文與各高等法院提高徵收額數標準整理
# 本檔可校訂；法令修正時改此處，程式不寫死。
meta:
  version: "1.0"
  updated: "2026-09-24"
  sources:
    - "民事訴訟法§77-13~§77-27（LFinder :8022，modified 20231129，effective_status=現行）"
    - "強制執行法§28-2、§28-3；勞動事件法§12、§13"
    - "臺灣高等法院民事訴訟與非訟事件及強制執行費用提高徵收額數標準（law.moj.gov.tw pcode=B0010054，113/12/30 修正，114/1/1 實施）"
  key_insight: |
    「114/1/1 新法」不是 §77-13 修正（§77-13 自 112/11/29 未變），
    而是各高等法院依 §77-27 報請司法院核准之**加徵**，且加徵為累進三級。
    各高等法院轄區之標準各自發布，須先依「原審法院」定轄區。

# ── 民訴§77-13 因財產權起訴（累進遞減）──────────────────────
# 「其畸零之數不滿萬元者，以萬元計算」→ 每萬元級距一律進位
base_property:
  basis: 民事訴訟法§77-13
  round_up_to: 10000
  tiers:
    - {from: 0,            to: 100000,     mode: flat,   amount: 1000, label: 十萬元以下部分}
    - {from: 100000,       to: 1000000,    mode: per10k, rate: 100,    label: 逾十萬元至一百萬元部分}
    - {from: 1000000,      to: 10000000,   mode: per10k, rate: 90,     label: 逾一百萬元至一千萬元部分}
    - {from: 10000000,     to: 100000000,  mode: per10k, rate: 80,     label: 逾一千萬元至一億元部分}
    - {from: 100000000,    to: 1000000000, mode: per10k, rate: 70,     label: 逾一億元至十億元部分}
    - {from: 1000000000,   to: null,       mode: per10k, rate: 60,     label: 逾十億元部分}

# ── 其他定額 ─────────────────────────────────────────────
flat_fees:
  non_property:        {amount: 3000, basis: 民訴§77-14Ⅰ, label: 非因財產權而起訴}
  retrial_ruling:      {amount: 1000, basis: 民訴§77-17Ⅱ, label: 對確定之裁定聲請再審}
  appeal_ruling:       {amount: 1000, basis: 民訴§77-18,   label: 抗告、再為抗告}
  motion_500:
    amount: 500
    basis: 民訴§77-19Ⅱ
    items: [聲請迴避, 聲請通知受擔保利益人行使權利, 聲請變換提存物或保證書,
            對於法院書記官之處分提出異議, 聲請發支付命令,
            聲請命假扣押假處分定暫時狀態處分之債權人於一定期間內起訴]
  motion_1000:
    amount: 1000
    basis: 民訴§77-19Ⅳ
    note: 聲請參加訴訟或駁回參加等（詳原文，本版僅列金額）

# ── 聲請調解（民訴§77-20Ⅰ，級距非累進，落哪級收哪級）────────
mediation:
  basis: 民訴§77-20Ⅰ
  non_property: {amount: 0, note: 非因財產權而聲請調解者免徵}
  tiers:
    - {from: 0,        to: 100000,   amount: 0,    label: 未滿十萬元免徵}
    - {from: 100000,   to: 1000000,  amount: 1000, label: 十萬元以上未滿一百萬元}
    - {from: 1000000,  to: 5000000,  amount: 2000, label: 一百萬元以上未滿五百萬元}
    - {from: 5000000,  to: 10000000, amount: 3000, label: 五百萬元以上未滿一千萬元}
    - {from: 10000000, to: null,     amount: 5000, label: 一千萬元以上}
  offset_note: 調解不成立後三十日內起訴者，所繳聲請費得扣抵裁判費（§77-20Ⅱ）

# ── 上訴加徵（民訴§77-16Ⅰ）────────────────────────────────
appeal:
  basis: 民訴§77-16Ⅰ
  multiplier: 1.5
  label: 向第二審或第三審法院上訴，依§77-13及§77-14加徵十分之五
  exempt_note: 發回或發交更審再行上訴者免徵；依§452Ⅱ移送經判決後再行上訴者亦同

# ── 強制執行（強執法§28-2Ⅰ）──────────────────────────────
execution:
  basis: 強制執行法§28-2Ⅰ
  exempt_below: 5000
  rate_per_100: 0.7        # 每百元收七角
  round_up_to: 100         # 畸零之數不滿百元者以百元計算

# ── 勞動事件暫免（勞動事件法§12Ⅰ）─────────────────────────
labor:
  basis: 勞動事件法§12Ⅰ
  scope: 確認僱傭關係或給付工資、退休金或資遣費涉訟，勞工或工會起訴或上訴
  defer_ratio: 0.666666667   # 暫免徵收三分之二
  label: 暫免徵收裁判費三分之二

# ── 高等法院提高徵收額數標準（§77-27 加徵）──────────────────
surcharge:
  versions:
    "114":
      effective_from: "1140101"
      law: 臺灣高等法院民事訴訟與非訟事件及強制執行費用提高徵收額數標準
      pcode: B0010054
      modified: "1131230"
      property_tiers:                        # §2 起訴、§3 上訴 同三級
        - {from: 0,        to: 100000,   rate: 0.5, label: 十萬元以下部分加徵十分之五}
        - {from: 100000,   to: 10000000, rate: 0.3, label: 逾十萬元至一千萬元部分加徵十分之三}
        - {from: 10000000, to: null,     rate: 0.1, label: 逾一千萬元部分加徵十分之一}
      non_property: 0.5                      # §2 後段、§3 後段：非因財產權加徵十分之五
      retrial_ruling: 0.5                    # §4 前段（§77-17Ⅱ）
      appeal_ruling: 0.5                     # §4 後段（§77-18）
      non_contentious: 0.5                   # §5
      execution: 0.142857143                 # §6 加徵七分之一（兩部相同）
      regions_note: |
        已收兩部：臺灣高等法院（pcode B0010054）與福建高等法院金門分院（pcode B0010059）。
        2026-09-24 逐條比對：**兩部加徵比例完全相同**，同為 113/12/30 修正、自發布日施行。
        故全國（含金門、連江）適用同一組比例。惟金門分院部第3條第3項另明定第二審訴之變更、
        追加、§54 起訴補徵與反訴準用，臺灣高等法院部未明文；涉此四種情形請回查原文。
    "113":
      status: needs_data
      note: 適用 113/12/31 前舊法者，須取「提高徵收額數標準」113/12/30 修正前之版本（92 年版）條文
