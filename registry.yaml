  - id: land.merge_share
    name: 土地數筆合併後應有部分之試算
    group: 其他
    photo: 14_IMG_5432
    status: ready
    module: land
    summary: 各筆（地號/面積/原應有部分）→ 應有面積合計、合併後應有部分
    params:
      rows: {type: array, required: true, desc: "[{name, lot, num, den, area_m2}]"}
    basis: [民法§823, 地籍測量實施規則§224]

  - id: rent.unjust
    name: 相當租金不當得利之試算（5年與按月給付版）
    group: 其他
    photo: 15_IMG_5433
    status: ready
    module: money
    summary: 申報地價 × 占用面積 × 年息 × 期間 × 原告應有部分 → 不當得利金額；另出按月給付額
    params:
      declared_price: {type: number, required: true, desc: "申報地價（元/㎡）"}
      area_m2: {type: number, required: true, desc: "占用面積（㎡）"}
      rate: {type: number, required: true, desc: "年息(%)；土地法§97/§105 實務上限為申報總地價年息10%"}
      start: {type: roc_date, required: true, desc: 請求起算日}
      end: {type: roc_date, required: true, desc: 請求終止日}
