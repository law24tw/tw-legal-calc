    summary: 被繼承人/繼承人/出生死亡日/繼承狀態 → 繼承系統表與應繼分
    inputs: [稱謂, 繼承人, 被繼承人, 繼承狀態, 出生日期, 死亡日期, 結婚日期, 建檔日期, 應繼分]
