    photo: 13_IMG_5431
    status: ready
    module: land
    summary: 分割前應有部分 → 維持共有者在該筆土地上分割後之應有部分（原應有部分 ÷ 維持共有者合計）
    params:
      area_m2: {type: number, desc: 總面積}
      unit_price: {type: number, desc: "地價(元/㎡)"}
