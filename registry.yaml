    group: 其他
    photo: 12_IMG_5430
    status: ready
    module: land
    summary: 多筆土地（地號/面積/公告現值）× 共有人應有部分 → 應有面積、應有價額
    params:
      parcels: {type: array, required: true, desc: "[{lot, area_m2, unit_price}]"}
